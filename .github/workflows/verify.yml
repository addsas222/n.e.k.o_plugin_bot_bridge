name: verify

# 注意：测试需要一棵 N.E.K.O. 源码树（`plugin.sdk.*` 从那里导入）。
# 用法：把仓库与 neko 源码树放在同一级，或用 NEKO_SOURCE_ROOT 指定路径。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # 测试要 import 真实的 plugin.sdk（见 tests/support.py），所以得有一棵
      # N.E.K.O. 源码树。上游仓库 570MB，用 sparse-checkout 只取 plugin/。
      - name: Checkout N.E.K.O. source tree (plugin.sdk)
        uses: actions/checkout@v4
        with:
          repository: addsas222/N.E.K.O
          path: neko
          sparse-checkout: plugin
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        # pydantic / msgpack — 宿主 SDK 与 MaiBot SDK 需要
        # pyyaml — AstrBot 的 metadata.yaml 需要
        # pytest-asyncio — 异步用例
        run: python -m pip install --upgrade pip pydantic msgpack pyyaml httpx aiohttp pytest pytest-asyncio
      - name: Unit, integration and packaging tests
        env:
          # 必须指向上面 sparse-checkout 出来的那棵树（旧值 ../neko 在 runner 上不存在）
          NEKO_SOURCE_ROOT: ${{ github.workspace }}/neko
        run: python -m pytest tests -q
      - name: End-to-end harness (offline)
        env:
          NEKO_SOURCE_ROOT: ${{ github.workspace }}/neko
        run: python -X utf8 tests/stub_run.py
